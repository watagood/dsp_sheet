<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AMC CSV → Excel（文字化け修正）</title>

  <style>
    :root{
      --bg1:#fff3f8;
      --bg2:#eef4ff;
      --card:#ffffff;
      --text:#111;
      --muted:#5f6470;
      --line:#e6e6f0;
      --shadow: 0 18px 60px rgba(20,20,35,.08);
      --shadow2: 0 10px 28px rgba(20,20,35,.08);
      --radius:22px;

      /* accent */
      --accent1:#ff4fa3;
      --accent2:#6b7cff;
      --accentGlow1: rgba(255,79,163,.25);
      --accentGlow2: rgba(107,124,255,.25);
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif;
      color:var(--text);
      background:
        radial-gradient(1000px 700px at 8% 8%, var(--bg1), transparent 60%),
        radial-gradient(1000px 700px at 92% 18%, var(--bg2), transparent 60%),
        linear-gradient(180deg,#fff,#f9faff);
      min-height:100vh;
    }

    .wrap{
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:36px 18px;
    }

    .card{
      width:min(1100px,100%);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:28px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    header{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    h1{
      margin:0;
      font-size:22px;
      letter-spacing:.2px;
    }

    .sub{
      font-size:13px;
      color:var(--muted);
      line-height:1.7;
    }

    .grid{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:16px;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
      background:linear-gradient(180deg,#fff,#fcfcff);
      box-shadow:var(--shadow2);
    }

    .label{
      font-size:12px;
      color:var(--muted);
      margin-bottom:8px;
    }

    /* upload */
    .drop{
      border:2px dashed rgba(107,124,255,.55);
      border-radius:18px;
      padding:18px;
      background:
        radial-gradient(700px 160px at 10% 0%, rgba(255,79,163,.12), transparent 60%),
        radial-gradient(700px 160px at 90% 0%, rgba(107,124,255,.14), transparent 60%),
        linear-gradient(180deg,#fff,#fdf7ff);
      box-shadow:0 12px 28px rgba(107,124,255,.10);
      transition:.15s;
    }
    .drop.dragover{
      border-color:#ff4fa3;
      box-shadow:0 0 0 6px var(--accentGlow2),0 14px 34px rgba(107,124,255,.18);
      transform:translateY(-1px);
    }

    input[type="file"]{
      width:100%;
      padding:12px;
      font-size:14px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
    }

    input[type="text"]{
      width:100%;
      padding:14px;
      font-size:15px;
      border-radius:14px;
      border:1px solid var(--line);
      background:#fff;
      outline:none;
    }
    input[type="text"]:focus{
      border-color:#b6a7ff;
      box-shadow:0 0 0 4px rgba(182,167,255,.25);
    }

    .hint{
      font-size:12px;
      color:var(--muted);
      margin-top:8px;
      line-height:1.6;
    }

    /* button */
    button{
      appearance:none;
      border:0;
      cursor:pointer;
      padding:16px 22px;
      border-radius:20px;
      font-size:15px;
      font-weight:900;
      letter-spacing:.3px;
      color:#fff;
      background:linear-gradient(135deg,var(--accent1),var(--accent2));
      box-shadow:
        0 16px 36px rgba(107,124,255,.28),
        0 12px 30px rgba(255,79,163,.22);
      transition:.12s;
    }
    button:hover{
      transform:translateY(-1px);
      filter:brightness(1.04);
    }
    button:disabled{
      opacity:.45;
      cursor:not-allowed;
      box-shadow:none;
    }

    .actions{
      display:flex;
      gap:14px;
      align-items:center;
    }

    .log{
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      background:#fff;
      font-size:13px;
      line-height:1.7;
    }

    .ok{color:#0a7;font-weight:800;}
    .warn{color:#b70;font-weight:800;}
    .err{color:#c00;font-weight:800;}
    .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}

    .credit{
      position:fixed;
      right:14px;
      bottom:10px;
      font-size:10px;
      color:rgba(0,0,0,.55);
      background:rgba(255,255,255,.7);
      border:1px solid rgba(230,230,240,.9);
      padding:6px 8px;
      border-radius:999px;
      backdrop-filter:blur(6px);
      pointer-events:none;
    }

    @media(max-width:900px){
      .grid{grid-template-columns:1fr;}
      .card{padding:20px;}
      h1{font-size:20px;}
    }
  </style>
</head>

<body>
  <div class="credit">watagood · miyu.watanabe</div>

  <div class="wrap">
    <div class="card">
      <header>
        <h1>AMC CSV → Excel（文字化け修正）</h1>
        <p class="sub">
          CSVをExcelで開ける <span class="mono">.xls</span> に変換します（ローカル処理のみ）。<br>
          Excel警告が出たら <b>OK</b> を押してください。
        </p>
      </header>

      <div class="grid">
        <section class="panel">
          <div class="label">CSVアップロード（複数OK）</div>
          <div id="drop" class="drop">
            <input id="files" type="file" multiple accept=".csv,.tsv,text/csv,text/tab-separated-values">
            <div class="hint">ドラッグ＆ドロップ対応。文字コードは自動判定。</div>
          </div>
          <div id="fileInfo" class="hint"></div>
        </section>

        <section class="panel">
          <div class="label">出力名デフォルト</div>
          <input id="defaultName" type="text" value="amc_report">
          <div class="hint">
            複数時：<span class="mono">_01, _02 …</span> が自動付与
          </div>
        </section>
      </div>

      <div class="actions">
        <button id="convert" disabled>Excelに変換してダウンロード</button>
      </div>

      <div id="log" class="log">ファイルを選ぶと変換できます。</div>
    </div>
  </div>

  <!-- ⚠️ JSは元コードそのまま入れてください（省略せず貼る） -->
</body>
</html>
